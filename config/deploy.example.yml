# Confianza — ejemplo de configuración de Kamal.
# Copia este archivo a config/deploy.yml y reemplaza los valores de ejemplo.
# Servidor: tu VPS (root@203.0.113.10 es una IP de documentación)
# Registry: GitHub Container Registry (ghcr.io)
# Dominio:  tu-dominio.example

service: confianza
image: tu-usuario/confianza

servers:
  web:
    - 203.0.113.10

# Proxy HTTPS con Let's Encrypt automático.
# IMPORTANTE: requiere config.assume_ssl + config.force_ssl en production.rb.
proxy:
  ssl: true
  hosts:
    - tu-dominio.example
    - www.tu-dominio.example
  app_port: 80
  healthcheck:
    path: /up
    interval: 10
    timeout: 5

registry:
  server: ghcr.io
  username: tu-usuario
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - CONFIANZA_DATABASE_PASSWORD
    - HOSTINGER_SMTP_PASSWORD
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    # Difusión en redes (docs/difusion-redes.md): cada red se activa sola
    # cuando existen sus variables — vacías, los adaptadores se saltean solos.
    # IG y FB activos desde 2026-07-10 (docs/guia-setup-meta.md): comparten
    # el mismo Page Access Token que no caduca.
    - TELEGRAM_BOT_TOKEN
    - TELEGRAM_CHAT_ID
    - INSTAGRAM_USER_ID
    - INSTAGRAM_ACCESS_TOKEN
    - FACEBOOK_PAGE_ID
    - FACEBOOK_PAGE_ACCESS_TOKEN
    # Gemini API (Google AI Studio): fondos generados con IA para las
    # tarjetas de posts informativos (Difusion::ImagenIa). Vacía, se saltea.
    - GOOGLE_API_KEY
    # Entrar con Google / Microsoft (docs/guia-setup-login-social.md). Cada
    # proveedor aparece en los formularios solo si tiene sus dos variables.
    - GOOGLE_OAUTH_CLIENT_ID
    - GOOGLE_OAUTH_CLIENT_SECRET
    - MICROSOFT_OAUTH_CLIENT_ID
    - MICROSOFT_OAUTH_CLIENT_SECRET
  clear:
    SOLID_QUEUE_IN_PUMA: true
    WEB_CONCURRENCY: 2
    # El accessory postgres corre en este mismo host con nombre confianza-postgres
    # dentro de la red docker de Kamal.
    DB_HOST: confianza-postgres
    RAILS_LOG_LEVEL: info

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Volumen persistente para ActiveStorage local (avatars + post media).
volumes:
  - "confianza_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: root

accessories:
  postgres:
    image: postgres:16
    host: 203.0.113.10
    port: "203.0.113.10:5432:5432"
    env:
      clear:
        POSTGRES_USER: confianza
        POSTGRES_DB:   confianza_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
