#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  decay_inactive_limits:
    class: DecayInactiveLimitsJob
    queue: default
    schedule: at 3am every day

  reconcile_balances:
    class: ReconcileBalancesJob
    queue: default
    schedule: every monday at 4am

  purge_identity_documents:
    class: PurgeIdentityDocumentsJob
    queue: default
    schedule: at 4:30am every day

  # Analítica propia: guardamos 13 meses de páginas vistas y nada más.
  purge_old_page_views:
    command: "PageView.where(visited_on: ...13.months.ago.to_date).in_batches(of: 5000).delete_all"
    schedule: at 5am every day
